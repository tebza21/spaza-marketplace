<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Offers | Spaza</title><link rel="stylesheet" href="css/style.css"></head><body><header class="header compact"><a class="brand" href="index.html"><img src="images/spaza-logo.png"></a><nav><a href="seller-centre.html">Seller Centre</a><a href="portal.html">Portal</a><button class="btn" onclick="signOut()">Log out</button></nav></header><main class="simple-page"><a href="seller-centre.html">← Seller Centre</a><h1>My Offers</h1><p><a class="btn primary" href="vendor-add-product.html">+ Add Product</a></p><p>Manage products you sell on Spaza.</p><div id="msg">Loading…</div><div id="list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/roles.js"></script><script>
(async()=>{try{const r=await getSessionRoles();if(!r.user||!r.codes.includes('SELLER')){location.href='portal.html';return}const s=await SpazaDB.from('sellers').select('id').eq('profile_id',r.user.id).maybeSingle();if(s.error)throw s.error;if(!s.data){msg.textContent='Seller account not found.';return}
let q=SpazaDB.from('seller_offers').select('*').eq('seller_id',s.data.id).limit(100);const x=await q;if(x.error)throw x.error;msg.textContent=(x.data||[]).length+' record(s) found.';list.innerHTML=(x.data||[]).map((row,i)=>'<div class="application-card"><b>Record '+(i+1)+'</b><pre>'+JSON.stringify(row,null,2)+'</pre></div>').join('')||'<p>No records yet.</p>'}catch(e){msg.textContent=e.message}})();
</script></body></html>
