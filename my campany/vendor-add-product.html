<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Product | Spaza</title><link rel="stylesheet" href="css/style.css"><style>
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.form-grid input,.form-grid textarea,.form-grid select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px}.preview{display:flex;gap:10px;flex-wrap:wrap}.preview img{width:90px;height:90px;object-fit:cover;border-radius:10px}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header class="header compact"><a class="brand" href="index.html"><img src="images/spaza-logo.png"></a><nav><a href="seller-centre.html">Seller Centre</a><a href="portal.html">Portal</a><button class="btn" onclick="signOut()">Log out</button></nav></header>
<main class="simple-page"><a href="seller-offers.html">← My Offers</a><h1>Add Product</h1><p>Create your own product listing. It will be linked to your vendor account.</p>
<form id="form" class="application-card"><div class="form-grid">
<input id="name" required placeholder="Product name"><input id="brand" placeholder="Brand"><input id="category" placeholder="Category"><input id="price" required type="number" min="0" step="0.01" placeholder="Selling price (R)"><input id="stock" required type="number" min="0" step="1" placeholder="Stock quantity"><input id="condition" value="NEW" placeholder="Condition"><input id="delivery" class="full" placeholder="Delivery information"><input id="returns" class="full" placeholder="Return policy"><textarea id="description" class="full" rows="5" placeholder="Product description"></textarea><textarea id="specs" class="full" rows="4" placeholder='Specifications JSON, e.g. {"colour":"Black","size":"M"}'></textarea><div class="full"><label>Product images</label><input id="images" type="file" accept="image/*" multiple><div id="preview" class="preview"></div></div></div><div class="actions"><button class="btn primary" type="submit">Publish Product</button><a class="btn" href="seller-centre.html">Cancel</a></div><p id="msg"></p></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/roles.js"></script><script>
let selected=[]; images.onchange=()=>{selected=[...images.files];preview.innerHTML=selected.map(f=>'<img src="'+URL.createObjectURL(f)+'">').join('')};
function slugify(x){return x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}
async function seller(){const r=await getSessionRoles();if(!r.user||!r.codes.includes('SELLER')){location.href='portal.html';throw Error('Seller access required')}const x=await SpazaDB.from('sellers').select('id').eq('profile_id',r.user.id).maybeSingle();if(x.error)throw x.error;if(!x.data)throw Error('Seller account not found');return {user:r.user,seller:x.data}}
form.onsubmit=async e=>{e.preventDefault();msg.textContent='Saving product…';try{const r=await seller();let specs={};if(specsInput=document.getElementById('specs').value.trim())specs=JSON.parse(specsInput);
const n=Date.now(), productNumber='PRD-'+n, slug=slugify(name.value)+'-'+String(n).slice(-6);
const p=await SpazaDB.from('products').insert({product_number:productNumber,name:name.value,slug,description:description.value, specifications:specs,is_active:true,created_by:r.user.id}).select().single();if(p.error)throw p.error;
const offer=await SpazaDB.from('seller_offers').insert({offer_number:'OFF-'+n,product_id:p.data.id,seller_id:r.seller.id,price:Number(price.value),condition:condition.value,delivery_information:{text:delivery.value},return_policy:{text:returns.value},status:'ACTIVE'}).select().single();if(offer.error)throw offer.error;
const inv=await SpazaDB.from('inventory').insert({offer_id:offer.data.id,quantity:Number(stock.value),reserved_quantity:0,reorder_level:0}).select().single();if(inv.error)throw inv.error;
if(selected.length){msg.textContent='Product saved. Images are selected but storage upload must be configured before publishing them.'}
else msg.textContent='Product published successfully.';form.reset();preview.innerHTML='';selected=[]}catch(e){msg.textContent=e.message}}</script></body></html>
