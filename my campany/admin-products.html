<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Products | Spaza</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="header compact"><a class="brand" href="admin.html"><img src="images/spaza-logo.png"></a><a href="index.html">Public Site</a></header>
<main class="simple-page"><a href="admin.html">← Admin Centre</a><h1>Products</h1><p>Master catalogue.</p><div id="msg">Loading…</div><div id="table"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/admin.js"></script><script>
(async()=>{try{await requireStaff();const rows=await adminProducts();document.getElementById("msg").textContent=rows.length+" products";document.getElementById("table").innerHTML='<div class="application-card"><table><thead><tr><th>Name</th><th>Status</th><th>Created</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+String(x.name||"")+'</td><td>'+String(x.status||x.is_active?"Active":"Inactive")+'</td><td>'+new Date(x.created_at).toLocaleDateString()+'</td></tr>').join("")+'</tbody></table></div>'}catch(e){document.getElementById("msg").textContent=e.message}})();
</script></body></html>
