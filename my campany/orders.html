<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Orders | Spaza</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="header compact"><a class="brand" href="index.html"><img src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="cart.html">🛒 Cart</a></div><a href="portal.html">My Portal</a><a href="auth-choice.html" id="authLink">Sign in</a></header>
<nav class="nav"><button class="menu-btn" id="menuBtn">☰</button><div class="nav-links"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="account.html">Account</a><a class="active" href="orders.html">Orders</a></div></nav>
<aside class="drawer" id="drawer"><div class="drawer-head"><strong>MY SPAZA</strong><button id="closeMenu">✕</button></div>
<a href="index.html">🏠 Home</a><a href="shop.html">🛍️ Shop</a><a href="cart.html">🛒 Cart</a><a href="account.html">👤 My Account</a><a href="orders.html">📦 My Orders</a><a href="partner.html">🤝 Become a Partner</a><a href="help.html">❓ Help</a></aside><div class="overlay" id="overlay"></div>
<main class="simple-page"><p class="eyebrow">MY SPAZA</p><h1>Orders & Tracking</h1><div id="orders"><p>Loading your orders…</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/supabase-auth.js"></script><script src="js/orders.js"></script><script src="js/app.js"></script>
<script>
(async()=>{
 const box=document.getElementById("orders");
 try{
  const u=await getCurrentUser(); if(!u){location.href="auth-choice.html";return;}
  const rows=await loadCustomerOrders(u.id);
  if(!rows.length){box.innerHTML='<div class="empty"><h2>No orders yet</h2><p>Start shopping to see your orders here.</p><a class="btn primary" href="shop.html">Shop Now</a></div>';return;}
  box.innerHTML=rows.map(o=>'<div class="tracking-demo"><h3>Order '+(o.order_number||o.id)+'</h3><p>Status: '+(o.status||'Processing')+'</p><a class="btn" href="help.html">Need help?</a></div>').join("");
 }catch(e){box.innerHTML='<div class="empty"><h3>Could not load orders</h3><p>'+e.message+'</p></div>';}
})();
</script></body></html>
